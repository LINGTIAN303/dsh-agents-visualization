  zh: 在 DSH 设置页查看、创建与编辑 AGENTS.md 等 AI 规则文件，覆盖项目目录链、DSH 的两个全局根，以及 25+ 个第三方工具的规则文件（按工具子 Tab 切换，含注入字节 / token 统计）。
