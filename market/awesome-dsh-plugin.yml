name: LINGTIAN303/dsh-agents-visualization
category: tools
description:
  en: Views, creates and edits AGENTS.md and other AI rule files from the DSH settings page, covering the project directory chain, both DSH global roots, and 25+ third-party tool rule files in per-tool sub-tabs with brand logos, injected-bytes / token stats, fullscreen focus and file-manager reveal.
  zh: 在 DSH 设置页查看、创建与编辑 AGENTS.md 等 AI 规则文件，覆盖项目目录链、DSH 的两个全局根，以及 25+ 个第三方工具的规则文件（按工具子 Tab 切换，带品牌图标、注入字节 / token 统计，支持全屏聚焦与资源管理器定位）。
